<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="vimat-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g filter="url(#subtle-shadow)">
    <!-- Shield / App Icon Background -->
    <rect x="4" y="5" width="40" height="40" rx="10" fill="url(#vimat-red)"/>
    <!-- Stylized V with integrated download arrow -->
    <path d="M 14 15 L 24 33 L 34 15 M 24 23 L 24 31 M 20 28 L 24 32 L 28 28" 
          stroke="#ffffff" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none"/>
  </g>

  <!-- Logo Typography -->
  <text x="54" y="34" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Poppins', sans-serif" 
        font-size="28" 
        font-weight="800" 
        letter-spacing="-0.5px">
    <tspan fill="#171717">Vim</tspan><tspan fill="#e53935">at</tspan>
  </text>
  <circle cx="168" cy="16" r="3" fill="#e53935"/>
</svg>
